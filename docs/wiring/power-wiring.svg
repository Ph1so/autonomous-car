<text class="th" x="615" y="68" text-anchor="middle" dominant-baseline="central">Motors</text></g>
<circle cx="595" cy="96" r="12" fill="none" stroke="#888780" stroke-width="1"/><circle cx="595" cy="96" r="3" fill="#888780"/>
<circle cx="635" cy="96" r="12" fill="none" stroke="#888780" stroke-width="1"/><circle cx="635" cy="96" r="3" fill="#888780"/>
<text class="ts" x="615" y="136" text-anchor="middle" dominant-baseline="central">16 AWG leads</text>
<g class="c-gray"><rect x="565" y="170" width="100" height="70" rx="6" stroke-width="0.5"/>
<text class="th" x="615" y="196" text-anchor="middle" dominant-baseline="central">Pi 5</text>
<text class="ts" x="615" y="216" text-anchor="middle" dominant-baseline="central">18 AWG, GPIO</text></g>
<g class="c-gray"><rect x="565" y="270" width="100" height="74" rx="6" stroke-width="0.5"/>
