<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img">
<title>Rover power wiring</title>
<desc>A 3S LiPo connects through an XT60 pigtail, a 20A DC switch and a 15A inline blade fuse to two lever nuts using 14 AWG wire. The lever nuts feed the motor driver with 16 AWG, the buck converter with 18 AWG, and the BEC with 20 to 22 AWG. The buck powers the Pi 5, which in turn powers the lidar, ESP32, camera and IMU. The BEC powers the servo.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F1EFE8;stroke:#888780}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
</style>
