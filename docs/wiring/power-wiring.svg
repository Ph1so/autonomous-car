<text class="th" x="128" y="280" text-anchor="middle" dominant-baseline="central">−</text>
<text class="th" x="85" y="330" text-anchor="middle" dominant-baseline="central">3S LiPo</text>
<text class="ts" x="85" y="348" text-anchor="middle" dominant-baseline="central">11.1V nominal</text>
<rect x="170" y="238" width="26" height="54" rx="3" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
