<path d="M350 370 L394 370 L394 100 L430 100" stroke="#2C2C2A" stroke-width="2.5"/>
<path d="M350 380 L406 380 L406 265 L430 265" stroke="#2C2C2A"/>
<path d="M350 390 L418 390 L418 430 L430 430" stroke="#2C2C2A" stroke-width="1.5"/>
<path d="M540 230 L553 230 L553 195 L565 195" stroke="#E24B4A"/>
<path d="M540 250 L558 250 L558 215 L565 215" stroke="#2C2C2A"/>
<path d="M540 405 L565 405" stroke="#E24B4A" stroke-width="1.5"/>
