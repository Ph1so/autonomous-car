<path d="M540 95 L565 95" stroke="#888780"/>
<path d="M615 240 L615 270" stroke="#888780"/>
</g>
<g class="c-coral"><rect x="30" y="220" width="110" height="90" rx="8" stroke-width="0.5"/></g>
<line x1="67" y1="226" x2="67" y2="304" stroke="#D85A30" stroke-width="0.5"/>
<line x1="103" y1="226" x2="103" y2="304" stroke="#D85A30" stroke-width="0.5"/>
