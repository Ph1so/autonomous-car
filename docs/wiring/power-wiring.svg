<rect x="296" y="132" width="10" height="8" rx="2" fill="#EF9F27"/><rect x="309" y="132" width="10" height="8" rx="2" fill="#EF9F27"/><rect x="322" y="132" width="10" height="8" rx="2" fill="#EF9F27"/><rect x="335" y="132" width="10" height="8" rx="2" fill="#EF9F27"/>
<text class="th" x="320" y="160" text-anchor="middle" dominant-baseline="central">+</text>
<text class="ts" x="320" y="198" text-anchor="middle" dominant-baseline="central">Lever nut +</text>
<rect class="box" x="290" y="360" width="60" height="40" rx="4" stroke-width="0.5"/>
<rect x="296" y="352" width="10" height="8" rx="2" fill="#EF9F27"/><rect x="309" y="352" width="10" height="8" rx="2" fill="#EF9F27"/><rect x="322" y="352" width="10" height="8" rx="2" fill="#EF9F27"/><rect x="335" y="352" width="10" height="8" rx="2" fill="#EF9F27"/>
