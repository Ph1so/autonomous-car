<text class="ts" x="485" y="261" text-anchor="middle" dominant-baseline="central">12V to 5V, 5A+</text></g>
<text class="ts" x="485" y="301" text-anchor="middle" dominant-baseline="central">18 AWG in</text>
<g class="c-teal"><rect x="430" y="380" width="110" height="70" rx="6" stroke-width="0.5"/>
<text class="th" x="485" y="406" text-anchor="middle" dominant-baseline="central">BEC</text>
<text class="ts" x="485" y="426" text-anchor="middle" dominant-baseline="central">Servo supply</text></g>
<text class="ts" x="485" y="466" text-anchor="middle" dominant-baseline="central">20 to 22 AWG in</text>
<circle cx="434" cy="70" r="2.5" fill="#085041"/><circle cx="434" cy="100" r="2.5" fill="#085041"/>
